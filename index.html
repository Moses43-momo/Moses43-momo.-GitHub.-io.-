<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08162e">
<meta name="description" content="Ciel de Feu : jeu de combat aérien en vue du dessus. Esquivez, tirez, lancez des missiles guidés et affrontez des appareils amiraux.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ciel de Feu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
/* Concept : plein écran, vue du dessus sur l'océan. Le canvas porte le jeu, les boutons et panneaux sont posés dessus.
   Univers volontairement sombre et unique (cockpit de nuit), donc un seul thème défini explicitement. */
:root {
  --sky-top: #08162e;
  --ocean: #0e4a78;
  --ink: #eaf3fa;
  --muted: #9db4c6;
  --accent: #ffb703;
  --danger: #ef4a4a;
  --ok: #4fd1a1;
  --panel: rgba(6, 16, 32, 0.84);
  --line: rgba(234, 243, 250, 0.16);
  --font-display: 'Chakra Petch', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-top);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: var(--ocean); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud-btns {
  position: absolute; top: 10px; right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px;
}
.ic {
  width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
  border: 1px solid rgba(234, 243, 250, 0.3); border-radius: 50%;
  background: rgba(6, 16, 32, 0.55); color: var(--ink); cursor: pointer;
}
.ic svg { width: 20px; height: 20px; }
.ic .slash { display: none; }
.ic.off .slash { display: block; }
.ic.off { color: var(--muted); }

.msl {
  position: absolute; bottom: 18px; right: max(16px, env(safe-area-inset-right, 0px));
  width: 78px; height: 78px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  border: 2px solid var(--accent); background: rgba(6, 16, 32, 0.6); color: var(--accent);
  font: 700 20px/1 var(--font-display); cursor: pointer; padding: 0;
  touch-action: none;
}
.msl:active { background: rgba(255, 183, 3, 0.25); }
.msl:disabled { border-color: rgba(234, 243, 250, 0.25); color: rgba(234, 243, 250, 0.35); cursor: default; }
.msl svg { width: 30px; height: 30px; }

button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.overlay {
  position: absolute; inset: 0; display: flex; overflow: auto;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(5, 14, 30, 0.5), rgba(5, 14, 30, 0.88));
}
.panel {
  margin: auto; width: 100%; max-width: 380px; padding: 24px 22px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
}
.kicker { margin: 0 0 6px; font: 600 12px/1.2 var(--font-display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0 0 12px; font: 700 clamp(36px, 11vw, 48px)/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
.lead { margin: 0 0 16px; color: var(--muted); }
.stats { margin: 0 0 18px; display: grid; gap: 6px; }
.stats:empty { display: none; }
.stats div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font: 700 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stats .new dd { color: var(--accent); }
.cta {
  width: 100%; min-height: 54px; border: 0; border-radius: 4px; background: var(--accent); color: #1a1200;
  font: 700 18px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
}
.cta:active { filter: brightness(0.9); }
.ghost {
  width: 100%; min-height: 46px; margin-top: 10px; border: 1px solid var(--line); border-radius: 4px; background: transparent;
  color: var(--ink); font: 600 14px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
}
.hint { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.hangar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 8px; }
.jet {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px;
  border: 1px solid var(--line); border-radius: 4px; background: rgba(234, 243, 250, 0.04);
  color: var(--ink); cursor: pointer; font: inherit; min-width: 0;
}
.jet canvas { width: 56px; height: 56px; }
.jet b { font: 700 13px/1.2 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
.jet small { font-size: 11px; line-height: 1.2; color: var(--muted); text-align: center; }
.jet.sel { border-color: var(--accent); background: rgba(255, 183, 3, 0.1); }
.jet.lock canvas { opacity: 0.35; filter: grayscale(1); }
.hmsg { min-height: 2.9em; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.adbtn {
  width: 100%; min-height: 48px; margin-bottom: 10px; border: 2px solid var(--accent); border-radius: 4px;
  background: transparent; color: var(--accent); font: 700 14px/1.1 var(--font-display);
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
}
.adlayer {
  position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
  padding: 20px; text-align: center; background: rgba(2, 8, 18, 0.95);
}
.adlayer p { margin: 0 0 12px; color: var(--muted); max-width: 300px; }
.adlayer b { display: block; margin-bottom: 14px; font: 700 44px/1 var(--font-display); color: var(--accent); }
[hidden] { display: none !important; }
.hint a { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .cta:active { filter: none; } }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--sky-top); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv" aria-label="Zone de jeu : combat aérien"></canvas>

  <div class="hud-btns" id="hud-btns" hidden>
    <button class="ic" id="snd" type="button" aria-label="Activer ou couper le son">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>
        <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
      </svg>
    </button>
    <button class="ic" id="pause" type="button" aria-label="Mettre en pause">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>

  <button id="msl" class="msl" type="button" aria-label="Lancer un missile guidé" hidden>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6v9l-3 3-3-3V8z"/><path d="M9 14l-4 4v2l4-2zM15 14l4 4v2l-4-2z"/></svg>
    <span id="msl-n">3</span>
  </button>

  <div id="adl" class="adlayer" hidden>
    <div>
      <p>Aperçu de la publicité (mode test). Dans l’application, une vraie vidéo s’affichera ici.</p>
      <b id="adl-n">3</b>
      <p>La récompense arrive dans un instant.</p>
    </div>
  </div>

  <div id="ov" class="overlay">
    <div class="panel">
      <p class="kicker" id="ov-kicker">Combat aérien</p>
      <h1 id="ov-title">Ciel de Feu</h1>
      <p class="lead" id="ov-text"></p>
      <dl class="stats" id="ov-stats"></dl>
      <div class="hangar" id="hangar" hidden></div>
      <p class="hmsg" id="hmsg" hidden></p>
      <button class="adbtn" id="ov-ad" type="button" hidden>Regarder une pub</button>
      <button class="cta" id="ov-go" type="button">Décoller</button>
      <button class="ghost" id="ov-alt" type="button" hidden>Menu</button>
      <p class="hint" id="ov-hint"></p>
      <p class="hint"><a href="privacy.html" target="_blank" rel="noopener">Politique de confidentialité</a></p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  var ov = document.getElementById('ov'), ovKicker = document.getElementById('ov-kicker'), ovTitle = document.getElementById('ov-title');
  var ovText = document.getElementById('ov-text'), ovStats = document.getElementById('ov-stats'), ovGo = document.getElementById('ov-go');
  var ovAlt = document.getElementById('ov-alt'), ovHint = document.getElementById('ov-hint');
  var hudBtns = document.getElementById('hud-btns'), btnPause = document.getElementById('pause'), btnSnd = document.getElementById('snd');
  var btnMsl = document.getElementById('msl'), mslN = document.getElementById('msl-n');
  var hangarEl = document.getElementById('hangar'), hmsg = document.getElementById('hmsg'), ovAd = document.getElementById('ov-ad');
  var adl = document.getElementById('adl'), adlNum = document.getElementById('adl-n');

  var W = 360, H = 640, scale = 1, dpr = 1, TAU = Math.PI * 2;
  var FONT = "'Chakra Petch', 'Arial Narrow', sans-serif";

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

  var best = 0;
  try { best = parseInt(localStorage.getItem('cielDeFeuBest') || '0', 10) || 0; } catch (e) {}

  /* ---------- état ---------- */
  var state = 'menu';
  var G = null, P = null;
  var bullets = [], ebullets = [], enemies = [], missiles = [], pups = [], parts = [], texts = [];
  var clouds = [], islands = [];
  var keys = {}, drag = null, tx = W / 2, ty = H - 130;
  var lastT = 0, bgScroll = 0, muted = false, ac = null;
  var SH = false, FL = false;

  /* ---------- avions et sauvegarde ---------- */
  var JETS = {
    falcon: { id: 'falcon', name: 'Faucon', desc: 'Équilibré', hp: 5, fire: 0.15, missiles: 3, dmg: 1, body: '#c6d3de', wing: '#8fa5b8', tip: '#ffb703', canopy: '#2ec4ff' },
    eagle: { id: 'eagle', name: 'Aigle', desc: 'Tir rapide, fragile', hp: 4, fire: 0.11, missiles: 3, dmg: 1, wave: 5, adsNeeded: 2, body: '#f1dcc0', wing: '#d9893a', tip: '#ef4a4a', canopy: '#ffe08a' },
    titan: { id: 'titan', name: 'Titan', desc: 'Blindé, tir lourd', hp: 7, fire: 0.2, missiles: 5, dmg: 2, wave: 10, adsNeeded: 3, body: '#a9c3a4', wing: '#5f7d62', tip: '#4fd1a1', canopy: '#d7f5e3' }
  };
  var JET_IDS = ['falcon', 'eagle', 'titan'];
  var save = { sel: 'falcon', ads: { eagle: 0, titan: 0 }, bestWave: 0 };
  try {
    var raw = JSON.parse(localStorage.getItem('cielDeFeuSave') || 'null');
    if (raw && typeof raw === 'object') {
      save.sel = JETS[raw.sel] ? raw.sel : 'falcon';
      save.bestWave = raw.bestWave | 0;
      if (raw.ads) { save.ads.eagle = raw.ads.eagle | 0; save.ads.titan = raw.ads.titan | 0; }
    }
  } catch (e) {}
  function persist() { try { localStorage.setItem('cielDeFeuSave', JSON.stringify(save)); } catch (e) {} }
  function unlocked(id) { var j = JETS[id]; return id === 'falcon' || save.bestWave >= j.wave || save.ads[id] >= j.adsNeeded; }
  if (!unlocked(save.sel)) save.sel = 'falcon';
  var curJet = JETS.falcon;

  function resize() {
    var r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    scale = r.width / W;
    H = r.height / scale;
  }

  /* ---------- son ---------- */
  function audioInit() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
  }
  function tone(f1, f2, dur, type, vol) {
    if (!ac || muted) return;
    var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!ac || muted) return;
    var n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = ac.createBufferSource(); s.buffer = b;
    var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    var g = ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  }
  function sfx(k) {
    if (k === 'shoot') tone(900, 480, 0.06, 'square', 0.01);
    else if (k === 'boom') noise(0.45, 0.25, 900);
    else if (k === 'hit') { noise(0.3, 0.3, 500); tone(200, 60, 0.25, 'sawtooth', 0.08); }
    else if (k === 'pick') tone(500, 1100, 0.18, 'triangle', 0.08);
    else if (k === 'missile') { noise(0.25, 0.12, 2500); tone(300, 120, 0.3, 'sawtooth', 0.04); }
  }

  /* ---------- décor ---------- */
  function makeIsland(y) {
    var pts = [], n = 9;
    for (var i = 0; i < n; i++) pts.push(rand(0.7, 1.2));
    return { x: rand(-20, W + 20), y: y, r: rand(40, 90), pts: pts, rot: rand(0, TAU) };
  }
  function initBg() {
    clouds = []; islands = [];
    for (var i = 0; i < 7; i++) clouds.push({ x: rand(-20, W + 20), y: rand(0, H), v: rand(70, 120), w: rand(50, 100), h: rand(22, 38), a: rand(0.16, 0.32) });
    for (var j = 0; j < 3; j++) islands.push(makeIsland(rand(-60, H)));
  }
  function bgUpdate(dt) {
    var i, c;
    bgScroll += dt * 38;
    for (i = 0; i < clouds.length; i++) {
      c = clouds[i]; c.y += c.v * dt;
      if (c.y > H + 60) { c.y = -60 - rand(0, 80); c.x = rand(-20, W + 20); }
    }
    for (i = 0; i < islands.length; i++) {
      islands[i].y += 38 * dt;
      if (islands[i].y > H + 130) islands[i] = makeIsland(-130);
    }
  }
  function blob(cx, cy, r, pts, rot) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var a = rot + i / pts.length * TAU, rr = r * pts[i];
      var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.8;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  function drawBg() {
    var i, g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a3a63'); g.addColorStop(1, '#14639a');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    // vaguelettes
    var off = bgScroll % 40, base = Math.floor(bgScroll / 40);
    ctx.strokeStyle = 'rgba(190,225,255,0.10)'; ctx.lineWidth = 2;
    for (var r = -1; r < H / 40 + 1; r++) {
      var y = r * 40 + off, idx = base - r;
      for (var k = 0; k < 4; k++) {
        var x = ((idx * 97 + k * 83) % W + W) % W;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 16, y); ctx.stroke();
      }
    }
    // îles
    for (i = 0; i < islands.length; i++) {
      var s = islands[i];
      blob(s.x, s.y, s.r * 1.18, s.pts, s.rot); ctx.fillStyle = 'rgba(160,220,235,0.22)'; ctx.fill();
      blob(s.x, s.y, s.r, s.pts, s.rot); ctx.fillStyle = '#d6c28e'; ctx.fill();
      blob(s.x, s.y, s.r * 0.68, s.pts, s.rot + 0.3); ctx.fillStyle = '#4a8a57'; ctx.fill();
      blob(s.x + 4, s.y - 2, s.r * 0.36, s.pts, s.rot + 0.9); ctx.fillStyle = '#3a7348'; ctx.fill();
    }
    // nuages
    for (i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.fillStyle = 'rgba(0,15,35,' + (c.a * 0.35) + ')';
      ctx.beginPath(); ctx.ellipse(c.x + 26, c.y + 44, c.w * 0.5, c.h * 0.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(245,250,255,' + c.a + ')';
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w * 0.5, c.h * 0.5, 0, 0, TAU);
      ctx.ellipse(c.x - c.w * 0.3, c.y + 4, c.w * 0.32, c.h * 0.4, 0, 0, TAU);
      ctx.ellipse(c.x + c.w * 0.3, c.y + 3, c.w * 0.34, c.h * 0.42, 0, 0, TAU);
      ctx.fill();
    }
  }

  /* ---------- sprites ---------- */
  function col(f) { return SH ? 'rgba(0,12,28,0.25)' : FL ? '#ffffff' : f; }
  function poly(p, f) {
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
    ctx.closePath(); ctx.fillStyle = col(f); ctx.fill();
  }
  function sym(p, f) {
    poly(p, f);
    var q = [];
    for (var i = 0; i < p.length; i += 2) q.push(-p[i], p[i + 1]);
    poly(q, f);
  }
  function circ(x, y, r, f) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = col(f); ctx.fill(); }

  function jetPlayer() {
    if (!SH) {
      var fl = 10 + Math.random() * 8;
      poly([-4, 20, 4, 20, 0, 20 + fl], '#ffb703');
      poly([-2, 20, 2, 20, 0, 20 + fl * 0.55], '#fff3b0');
    }
    sym([0, -28, 5, -10, 5, 16, 0, 22], curJet.body);
    sym([4, -4, 27, 17, 27, 22, 4, 13], curJet.wing);
    sym([22, 15, 27, 17, 27, 22, 22, 19], curJet.tip);
    sym([4, 12, 13, 23, 13, 26, 4, 22], curJet.wing);
    if (!SH) { ctx.beginPath(); ctx.ellipse(0, -8, 3.2, 7, 0, 0, TAU); ctx.fillStyle = curJet.canopy; ctx.fill(); }
  }
  function jetScout() {
    sym([0, -14, 4, -2, 4, 12, 0, 16], '#aebfb2');
    sym([3, 0, 17, 13, 17, 17, 3, 10], '#6f8f78');
    sym([3, 10, 8, 17, 3, 16], '#6f8f78');
  }
  function jetFighter() {
    sym([0, -20, 5, -6, 5, 14, 0, 18], '#e07a5f');
    sym([5, -4, 24, 10, 24, 15, 5, 10], '#a43d34');
    sym([4, 12, 11, 20, 4, 18], '#a43d34');
    if (!SH) circ(0, -8, 3, '#1d2a3a');
  }
  function jetBomber() {
    sym([0, -26, 8, -12, 9, 20, 0, 26], '#7b8a68');
    sym([8, -6, 36, 6, 36, 14, 8, 12], '#59684b');
    sym([14, -6, 21, -6, 21, 14, 14, 14], '#3d4636');
    sym([6, 18, 16, 26, 6, 26], '#59684b');
    if (!SH) { circ(-17, -8, 2, '#ef4a4a'); circ(17, -8, 2, '#ef4a4a'); }
  }
  function jetBoss(t) {
    sym([0, -50, 14, -26, 16, 30, 0, 42], '#2d3240');
    sym([14, -18, 64, 6, 64, 22, 46, 30, 16, 24], '#3b4254');
    sym([30, 0, 38, 0, 38, 26, 30, 26], '#232733');
    sym([56, 8, 64, 6, 64, 22, 58, 20], '#ef4a4a');
    var pulse = 0.5 + 0.5 * Math.sin(t * 4);
    circ(0, -10, 7, 'rgb(255,' + Math.round(90 + pulse * 80) + ',70)');
    if (!SH) circ(0, -10, 3, '#fff3b0');
  }

  function drawEnemy(e) {
    for (var pass = 0; pass < 2; pass++) {
      SH = pass === 0;
      FL = e.flash > 0 && !SH;
      ctx.save();
      ctx.translate(e.x + (SH ? 16 : 0), e.y + (SH ? 28 : 0));
      ctx.scale(1, -1);
      if (e.type === 'scout') jetScout();
      else if (e.type === 'fighter') jetFighter();
      else if (e.type === 'bomber') jetBomber();
      else jetBoss(e.t);

    ctx.save(); ctx.translate(sx, sy);
    drawBg();
    if (state === 'menu' || !G) {
      curJet = JETS[save.sel];
      drawPlayerJet(W / 2, H * 0.7 + Math.sin(performance.now() / 500) * 6, Math.sin(performance.now() / 900) * 0.4, 0);
    } else {
      for (i = 0; i < pups.length; i++) {
        p = pups[i];
        var pr = 12 + Math.sin(p.ph * 1.5) * 1.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, pr + 5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU); ctx.fillStyle = PUPCOL[p.t]; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(8,22,46,0.7)'; ctx.stroke();
        ctx.fillStyle = '#08162e'; ctx.font = '700 14px ' + FONT; ctx.textAlign = 'center';
        ctx.fillText(p.t, p.x, p.y + 5);
      }
      for (i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
      for (i = 0; i < missiles.length; i++) {
        m = missiles[i];
        ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.a);
        var fl = 8 + Math.random() * 6;
        ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(-8 - fl, 0); ctx.lineTo(-8, 2); ctx.fill();
        ctx.fillStyle = '#e8edf2'; ctx.fillRect(-9, -2.5, 17, 5);
        ctx.fillStyle = '#ef4a4a'; ctx.beginPath(); ctx.moveTo(8, -2.5); ctx.lineTo(13, 0); ctx.lineTo(8, 2.5); ctx.fill();
        ctx.fillStyle = '#8fa5b8'; ctx.fillRect(-9, -5.5, 5, 11);
        ctx.restore();
      }
      for (i = 0; i < bullets.length; i++) {
        b = bullets[i];
        var bw = b.dmg > 1 ? 2.5 : 1.5;
        ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffd98a'; ctx.fillRect(b.x - bw - 2, b.y - 9, bw * 2 + 4, 17);
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff6c9'; ctx.fillRect(b.x - bw, b.y - 8, bw * 2, 14);
      }
      for (i = 0; i < ebullets.length; i++) {
        b = ebullets[i];
        ctx.globalAlpha = 0.4; ctx.fillStyle = '#ff6b4a'; ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff1e6'; ctx.beginPath(); ctx.arc(b.x, b.y, 3.6, 0, TAU); ctx.fill();
      }
      curJet = P.jet;
      if (!G.dead && !(P.inv > 0 && Math.floor(G.time * 14) % 2 === 0)) drawPlayerJet(P.x, P.y, P.bank, P.shield);
      for (i = 0; i < parts.length; i++) {
        p = parts[i]; k = p.life / p.max;
        if (p.kind === 'ring') {
          ctx.globalAlpha = k * 0.7; ctx.strokeStyle = p.c; ctx.lineWidth = 3 * k + 1;
          ctx.beginPath(); ctx.arc(p.x, p.y, (1 - k) * p.size, 0, TAU); ctx.stroke();
        } else if (p.kind === 'smoke') {
          ctx.globalAlpha = k * 0.35; ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - k), 0, TAU); ctx.fill();
        } else {
          ctx.globalAlpha = Math.min(1, k * 1.4); ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, TAU); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center'; ctx.font = '700 14px ' + FONT;
      for (i = 0; i < texts.length; i++) {
        e = texts[i];
        ctx.globalAlpha = Math.min(1, e.t * 2); ctx.fillStyle = '#ffffff';
        ctx.fillText(e.s, clamp(e.x, 60, W - 60), e.y);
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (G && state !== 'menu') drawHUD();
  }

  /* ---------- interface ---------- */
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  function fmt(n) { return n.toLocaleString('fr-FR'); }
  function row(l, v, cls) {
    var d = document.createElement('div'), a = document.createElement('dt'), c = document.createElement('dd');
    a.textContent = l; c.textContent = v; d.appendChild(a); d.appendChild(c);
    if (cls) d.className = cls;
    return d;
  }
  function setHud(on) { hudBtns.hidden = !on; btnMsl.hidden = !on; }
  function showOverlay(kind) {
    while (ovStats.firstChild) ovStats.removeChild(ovStats.firstChild);
    ovAlt.hidden = true; ovText.textContent = ''; ovHint.textContent = '';
    hangarEl.hidden = true; hmsg.hidden = true; ovAd.hidden = true; adMode = '';
    if (kind === 'menu') {
      ovKicker.textContent = 'Combat aérien'; ovTitle.textContent = 'Ciel de Feu';
      ovText.textContent = 'Esquivez, abattez l’escadre ennemie et affrontez un appareil amiral toutes les cinq vagues.';
      ovStats.appendChild(row('Meilleur score', fmt(best)));
      ovGo.textContent = 'Décoller';
      unlockTarget = ''; hangarEl.hidden = false; renderHangar();
      ovHint.textContent = coarse
        ? 'Glissez le doigt pour piloter. Le tir est automatique. Touchez le bouton missile pour lancer un missile guidé.'
        : 'Souris ou flèches (ZQSD) pour piloter, tir automatique. Espace ou M : missile guidé. P : pause.';
    } else if (kind === 'pause') {
      ovKicker.textContent = 'En vol'; ovTitle.textContent = 'Pause';
      ovStats.appendChild(row('Score', fmt(G.score)));
      ovStats.appendChild(row('Vague', String(Math.max(1, G.wave))));
      ovGo.textContent = 'Reprendre'; ovAlt.textContent = 'Abandonner'; ovAlt.hidden = false;
    } else {
      ovKicker.textContent = 'Mission terminée'; ovTitle.textContent = 'Appareil perdu';
      ovStats.appendChild(row('Score', fmt(G.score)));
      ovStats.appendChild(row(G.isNew ? 'Nouveau record' : 'Meilleur score', fmt(best), G.isNew ? 'new' : ''));
      ovStats.appendChild(row('Vague atteinte', String(Math.max(1, G.wave))));
      ovStats.appendChild(row('Appareils abattus', String(G.kills)));
      ovGo.textContent = 'Rejouer'; ovAlt.textContent = 'Menu'; ovAlt.hidden = false;
      if (!G.continued && adsOn()) { ovAd.textContent = 'Continuer avec 3 PV · voir une pub'; ovAd.hidden = false; adMode = 'continue'; }
    }
    ov.hidden = false;
    setHud(false);
    try { ovGo.focus({ preventScroll: true }); } catch (e) {}
  }
  /* ---------- hangar ---------- */
  var adMode = '', unlockTarget = '';
  function jetStatus(id) {
    var j = JETS[id];
    if (unlocked(id)) return id === save.sel ? 'Choisi' : 'Débloqué';
    return adsOn() ? 'Vague ' + j.wave + ' ou ' + j.adsNeeded + ' pubs' : 'Vague ' + j.wave;
  }
  function showJetInfo() {
    var id = unlockTarget && !unlocked(unlockTarget) ? unlockTarget : save.sel, j = JETS[id];
    hmsg.hidden = false; ovAd.hidden = true; adMode = '';
    if (!unlocked(id) && !adsOn()) {
      hmsg.textContent = j.name + ' : ' + j.desc + '. Atteignez la vague ' + j.wave + ' pour le débloquer.';
    } else if (!unlocked(id)) {
      var n = save.ads[id];
      hmsg.textContent = j.name + ' : ' + j.desc + '. Atteignez la vague ' + j.wave + ' ou regardez ' + j.adsNeeded + ' pubs (' + n + '/' + j.adsNeeded + ').';
      ovAd.textContent = 'Regarder une pub (' + (n + 1) + '/' + j.adsNeeded + ')';
      ovAd.hidden = false; adMode = 'unlock';
    } else {
      hmsg.textContent = j.name + ' : ' + j.desc + ' · ' + j.hp + ' PV, ' + j.missiles + ' missiles.';
    }
  }
  function renderHangar() {
    while (hangarEl.firstChild) hangarEl.removeChild(hangarEl.firstChild);
    JET_IDS.forEach(function (id) {
      var j = JETS[id], b = document.createElement('button'), c = document.createElement('canvas');
      b.type = 'button';
      b.className = 'jet' + (id === save.sel ? ' sel' : '') + (unlocked(id) ? '' : ' lock');
      c.width = 112; c.height = 112;
      var mainCtx = ctx, prevJet = curJet;
      ctx = c.getContext('2d'); curJet = j; SH = false; FL = false;
      ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.translate(28, 24); ctx.scale(0.62, 0.62);
      jetPlayer();
      ctx = mainCtx; curJet = prevJet;
      var nm = document.createElement('b'), st = document.createElement('small');
      nm.textContent = j.name; st.textContent = jetStatus(id);
      b.appendChild(c); b.appendChild(nm); b.appendChild(st);
      b.addEventListener('click', function () { pickJet(id); });
      hangarEl.appendChild(b);
    });
    showJetInfo();
  }
  function pickJet(id) {
    if (unlocked(id)) { save.sel = id; persist(); unlockTarget = ''; } else unlockTarget = id;
    renderHangar();
  }

  /* ---------- publicité récompensée ---------- */
  // Identifiant de TEST fourni par Google : à remplacer par votre propre bloc d'annonces avant la mise en ligne.
  var ADMOB_REWARD_ID = 'ca-app-pub-3940256099942544/5224354917';
  var ADS_PREVIEW = false; // true : simule la pub dans le navigateur (démo). La version à publier met false.
  function adsOn() { return !!AdPlugin || ADS_PREVIEW; }
  var adBusy = false, adFlag = false;
  var AdPlugin = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) || null;
  if (AdPlugin) {
    try { AdPlugin.initialize({}); AdPlugin.addListener('onRewardedVideoAdReward', function () { adFlag = true; }); } catch (e) {}
  }
  function showRewarded(cb) {
    if (adBusy) return;
    adBusy = true;
    function done(ok) { adBusy = false; cb(!!ok); }
    if (AdPlugin) {
      adFlag = false;
      AdPlugin.prepareRewardVideoAd({ adId: ADMOB_REWARD_ID })
        .then(function () { return AdPlugin.showRewardVideoAd(); })
        .then(function (r) { done(adFlag || (r && r.amount != null)); })
        .catch(function () { done(false); });
      return;
    }
    // Aperçu dans le navigateur : simule une pub de 3 secondes.
    var n = 3; adl.hidden = false; adlNum.textContent = String(n);
    var t = setInterval(function () {
      n--;
      if (n <= 0) { clearInterval(t); adl.hidden = true; done(true); }
      else adlNum.textContent = String(n);
    }, 1000);
  }
  function revive() {
    if (state !== 'over' || !G) return;
    G.continued = true; G.dead = false;
    P.hp = Math.min(P.maxHp, 3); P.inv = 2.5; P.shield = 3;
    ebullets = []; G.combo = 0; drag = null; tx = P.x; ty = P.y;
    state = 'play'; ov.hidden = true; setHud(true); updateMissileBtn();
  }
  function onAdClick() {
    if (adMode === 'unlock') {
      var id = unlockTarget;
      showRewarded(function (ok) {
        if (!ok) return;
        save.ads[id]++;
        if (unlocked(id)) { save.sel = id; unlockTarget = ''; }
        persist(); renderHangar();
      });
    } else if (adMode === 'continue') {
      showRewarded(function (ok) { if (ok) revive(); });
    }
  }

  function startPlay() {
    audioInit();
    if (state !== 'pause') newGame();
    state = 'play'; ov.hidden = true; setHud(true); updateMissileBtn();
  }
  function pauseGame() {
    if (state !== 'play' || !G || G.dead) return;
    state = 'pause'; drag = null; showOverlay('pause');
  }
  function endRun() {
    state = 'over';
    save.bestWave = Math.max(save.bestWave, G.wave); persist();
    G.isNew = G.score > best;
    if (G.isNew) { best = G.score; try { localStorage.setItem('cielDeFeuBest', String(best)); } catch (e) {} }
    showOverlay('over');
  }
  function toMenu() { state = 'menu'; showOverlay('menu'); }

  ovGo.addEventListener('click', startPlay);
  ovAd.addEventListener('click', onAdClick);
  ovAlt.addEventListener('click', toMenu);
  btnPause.addEventListener('click', pauseGame);
  btnSnd.addEventListener('click', function () {
    muted = !muted; btnSnd.classList.toggle('off', muted); audioInit();
  });
  btnMsl.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); audioInit(); fireMissile(); });
  btnMsl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); } });

  function toLogical(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  cv.addEventListener('pointerdown', function (e) {
    if (state !== 'play' || !G || G.dead) return;
    audioInit();
    var p = toLogical(e);
    drag = { id: e.pointerId, sx: p.x, sy: p.y, ox: tx, oy: ty };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var p = toLogical(e);
    tx = clamp(drag.ox + (p.x - drag.sx) * 1.2, 22, W - 22);
    ty = clamp(drag.oy + (p.y - drag.sy) * 1.2, 70, H - 36);
  });
  function endDrag(e) { if (drag && e.pointerId === drag.id) drag = null; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'm' || k === 'M') {
      if (state === 'play') { e.preventDefault(); fireMissile(); }
      return;
    }
    if (k === 'p' || k === 'P' || k === 'Escape') { if (state === 'play') pauseGame(); return; }
    if (k.indexOf('Arrow') === 0 && state === 'play') e.preventDefault();
    keys[k.length === 1 ? k.toLowerCase() : k] = true;
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key; keys[k.length === 1 ? k.toLowerCase() : k] = false;
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) { try { new ResizeObserver(resize).observe(stage); } catch (e) {} }

  /* ---------- boucle ---------- */
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.033, (ts - lastT) / 1000 || 0.016);
    lastT = ts;
    if (!cv.width) resize();
    if (state !== 'pause') bgUpdate(dt);
    if (state === 'play') update(dt);
    render();
  }

  resize();
  initBg();
  showOverlay('menu');
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
